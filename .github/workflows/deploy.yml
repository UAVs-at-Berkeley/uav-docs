name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build -L

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEB_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          SSH_USER: ${{ secrets.WEB_SSH_USER }}
          SSH_PORT: ${{ secrets.WEB_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -rltvz --delete \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./result/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
